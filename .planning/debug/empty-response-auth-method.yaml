## Current Focus

hypothesis: CONFIRMED - AcpClient.resolveAuthMethodOrder() places selectedAuthType blindly first in the list, so when selectedAuthType="iflow" the "iflow" (legacy API-key) auth is used instead of "oauth-iflow", causing empty responses from the CLI model
test: Traced full chain from settings file -> resolveAuthMethodOrder -> authenticate call -> CLI session -> empty response
expecting: Fix ensures oauth-iflow always comes before iflow regardless of selectedAuthType
next_action: COMPLETE - fix applied and verified

## Symptoms

expected: AI should return a non-empty text response after sending a prompt
actual: The response comes back empty (no text content rendered in the webview)
errors: No visible errors - the response just appears empty
reproduction: Send any message through the VS Code extension. The response will be empty when the auth method is "iflow" instead of "oauth-iflow"
started: Intermittent issue - happens when selectedAuthType in settings is "iflow"

