## Resolution

root_cause: >
  AcpClient.resolveAuthMethodOrder() (src/acp/client/acpClientFacade.ts:278) places
  the user's selectedAuthType from ~/.iflow/settings.json as the FIRST item in the auth
  priority list. When selectedAuthType="iflow" (legacy API-key auth), this causes the
  extension to authenticate with "iflow" before trying "oauth-iflow". The "iflow" auth
  call succeeds (doesn't throw), so the loop breaks and "oauth-iflow" is never attempted.
  The CLI then runs the model under API-key auth which returns empty responses, while
  "oauth-iflow" would have established a proper OAuth session with valid model access.

fix: >
  Modified resolveAuthMethodOrder() to only honour selectedAuthType as a priority boost
  when it is a custom/external auth type (not one of the built-in types: "oauth-iflow",
  "iflow", "openai-compatible"). When selectedAuthType is one of these built-in values,
  the hardcoded default order ["oauth-iflow", "iflow", "openai-compatible"] is used,
  ensuring oauth-iflow is always tried first.

verification: >
  1. Compiled TypeScript successfully (no errors)
  2. All 252 pre-existing unit tests pass
  3. Added new regression test "oauth-iflow is preferred over iflow even when
     selectedAuthType is 'iflow'" which validates the fix; all 253 tests pass.
  4. Traced logic manually: with selectedAuthType="iflow", effectiveSelectedType=null,
     so list becomes ["oauth-iflow", "iflow", "openai-compatible"] - correct order.

